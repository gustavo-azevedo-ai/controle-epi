<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPI Uai</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2064%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23F2B705%22/%3E%3Cpath%20d%3D%22M13%2041%20A19%2019%200%200%201%2051%2041%20Z%22%20fill%3D%22%231E1800%22/%3E%3Crect%20x%3D%2229%22%20y%3D%2221.5%22%20width%3D%226%22%20height%3D%2219.5%22%20rx%3D%222%22%20fill%3D%22%23F2B705%22/%3E%3Cpath%20d%3D%22M20.5%2041%20A12.5%2012.5%200%200%201%2024%2031.5%22%20fill%3D%22none%22%20stroke%3D%22%23F2B705%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M9%2041%20H53%20Q58%2041%2058%2045.5%20V46%20H11%20Q9%2046%209%2044%20Z%22%20fill%3D%22%231E1800%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#0E4A57">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#152629; --muted:#5A696B; --line:#D4DBD9;
  --brand:#0E4A57; --brand-2:#0B3C47; --brand-ink:#E6F0F0; --brand-muted:#9FC0C3;
  --accent:#F2B705; --accent-ink:#1E1800; --accent-soft:#FFF4C9;
  --ok:#23724A; --ok-bg:#E2F2E8; --warn:#8F5B00; --warn-bg:#FCEFCF; --bad:#B0261E; --bad-bg:#FBE3E0;
  --radius:10px; --shadow:0 1px 2px rgba(12,34,38,.06),0 6px 20px rgba(12,34,38,.06);
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --display:'Barlow Semi Condensed','Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1719; --surface:#152124; --surface-2:#1A292D; --ink:#E4ECEA; --muted:#98A9A7; --line:#2A3B3F;
    --brand:#0A3640; --brand-2:#082C34; --brand-ink:#DCEBEB; --brand-muted:#7FA5A9;
    --accent:#F5C21B; --accent-ink:#1E1800; --accent-soft:#3A3212;
    --ok:#6FCB95; --ok-bg:#16332A; --warn:#F0B84A; --warn-bg:#3A2E12; --bad:#FF8A80; --bad-bg:#3D1C1A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1719; --surface:#152124; --surface-2:#1A292D; --ink:#E4ECEA; --muted:#98A9A7; --line:#2A3B3F;
  --brand:#0A3640; --brand-2:#082C34; --brand-ink:#DCEBEB; --brand-muted:#7FA5A9;
  --accent:#F5C21B; --accent-ink:#1E1800; --accent-soft:#3A3212;
  --ok:#6FCB95; --ok-bg:#16332A; --warn:#F0B84A; --warn-bg:#3A2E12; --bad:#FF8A80; --bad-bg:#3D1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0}
h1{font-size:28px;letter-spacing:.005em}
h2{font-size:20px}
h3{font-size:16px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* Layout */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--brand);color:var(--brand-ink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}
.brandmark{display:flex;align-items:center;gap:10px;padding:0 8px}
.brandmark .logo{width:36px;height:36px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none;overflow:hidden}
.brandmark b em,.login .brandmark b em{font-style:normal;color:var(--accent)}
.login .brandmark b em{color:#C99700}
.brandmark b{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;display:block;line-height:1.1}
.brandmark span{font-size:12px;color:var(--brand-muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandmark .logo.img{background:#fff;padding:3px;width:40px;height:40px}
.brandmark .logo.img img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.logo-drop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px;border:1px dashed var(--line);border-radius:8px}
.logo-drop .prev{width:150px;height:64px;background:#fff;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:#888;font-size:12px}
.logo-drop .prev img{max-width:100%;max-height:100%;object-fit:contain}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--brand-ink);font-weight:500}
.nav a svg{width:19px;height:19px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.active{background:rgba(255,255,255,.12)}
.nav a.cta{background:var(--accent);color:var(--accent-ink);margin:6px 0 10px;font-weight:600}
.nav a.cta:hover{filter:brightness(1.04)}
.side-foot{margin-top:auto;font-size:12px;color:var(--brand-muted);padding:0 8px}
.side-foot .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand-muted);margin-right:6px;vertical-align:1px}
.side-foot .dot.on{background:#5BD08B}
main{padding:28px clamp(16px,3vw,40px) 48px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;gap:0;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
  .brandmark,.side-foot{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;text-align:center}
  .nav a.cta{margin:0;order:0}
  .nav a .lbl-long{display:none}
  main{padding:18px 14px 110px}
  h1{font-size:24px}
}
@media (min-width:861px){.nav a .lbl-short{display:none}}

/* Components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-primary:hover{background:var(--accent);filter:brightness(1.05)}
.btn-dark{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-dark:hover{background:var(--brand-2)}
.btn-danger{color:var(--bad)}
.btn-lg{padding:13px 20px;font-size:16px;min-height:50px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;width:38px;height:38px;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-pad{padding:18px 20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.g2,.g3{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:600;color:var(--muted);flex:none;overflow:hidden;font-size:15px}
.avatar.lg{width:84px;height:84px;font-size:28px}
.person{display:flex;align-items:center;gap:12px;min-width:0}
.person b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person span{font-size:13px;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);border-left:4px solid var(--line)}
.kpi .v{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v.money{font-size:clamp(17px,1.7vw,24px);padding:4px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.bad{border-left-color:var(--bad)} .kpi.bad .v{color:var(--bad)}
.kpi.warn{border-left-color:var(--warn)} .kpi.warn .v{color:var(--warn)}
.kpi.ok{border-left-color:var(--ok)}

/* Tables */
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t td.r,table.t th.r{text-align:right}

/* Forms */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:40px;width:100%}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.search{position:relative;flex:1;min-width:200px}
.search .input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form .full{grid-column:1/-1}
@media (max-width:620px){.form{grid-template-columns:1fr}}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:19px;height:19px;margin-top:2px;accent-color:var(--brand);flex:none}
.section-title{font-family:var(--display);font-size:15px;font-weight:600;margin:6px 0 -2px;grid-column:1/-1;padding-top:10px;border-top:1px solid var(--line)}

/* Modal */
#modal-root .backdrop{position:fixed;inset:0;background:rgba(8,20,23,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 14px 24px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto 0;overflow:hidden}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}

/* Scanner: the one loud element */
.cam-modal .modal-head{border-bottom:0;position:relative;padding-top:22px}
.cam-modal .modal-head::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,#1b1b1b 12px 24px)}
.scanner{position:relative;aspect-ratio:4/3;background:#0A1214;border-radius:12px;overflow:hidden;margin:0 20px}
.scanner video,.scanner canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.scanner img.still{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0A1214}
.scanner [hidden],.modal-foot [hidden]{display:none!important}
.scanner .brackets{position:absolute;inset:12% 22%;pointer-events:none}
.scanner .brackets i{position:absolute;width:34px;height:34px;border:4px solid var(--accent)}
.scanner .brackets i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:10px}
.scanner .brackets i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:10px}
.scanner .brackets i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:10px}
.scanner .brackets i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:10px}
.scanner.matched .brackets i{border-color:#5BD08B}
.scan-status{margin:14px 20px 0;padding:10px 14px;border-radius:8px;background:var(--surface-2);font-weight:500;min-height:44px}
.scan-status[data-tone="ok"]{background:var(--ok-bg);color:var(--ok)}
.scan-status[data-tone="warn"]{background:var(--warn-bg);color:var(--warn)}
.scan-status[data-tone="bad"]{background:var(--bad-bg);color:var(--bad)}
.samples{display:flex;gap:6px;margin:12px 20px 0}
.samples span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.samples span.on{background:var(--accent)}
.sig-wrap{background:#fff;border:1px dashed #9aa;border-radius:10px;position:relative}
.sig-wrap canvas{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
.sig-wrap .base{position:absolute;left:8%;right:8%;bottom:22%;border-bottom:1px solid #bbb;pointer-events:none}

/* Wizard */
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps div{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:14px}
.steps b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--display);font-size:13px}
.steps .on{color:var(--ink);border-color:var(--brand)}
.steps .on b{background:var(--brand);color:var(--brand-ink)}
.steps .done b{background:var(--ok);color:#fff}
.face-cta{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:26px;background:var(--brand);color:var(--brand-ink);border-radius:var(--radius);border:0;cursor:pointer;text-align:left;width:100%;min-height:220px;justify-content:flex-end;position:relative;overflow:hidden}
.face-cta svg.big{position:absolute;right:-10px;top:-10px;width:170px;height:170px;opacity:.14}
.face-cta b{font-family:var(--display);font-size:24px;font-weight:600}
.face-cta span{color:var(--brand-muted);max-width:34ch}
.face-cta .btn{pointer-events:none}
.pick-list{max-height:430px;overflow-y:auto}
.pick-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.pick-row:hover{background:var(--surface-2)}
.epi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.epi-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px}
.epi-card.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.epi-card .top{display:flex;gap:10px;align-items:flex-start}
.epi-card .top b{display:block;font-weight:600}
.epi-card .meta{display:flex;gap:6px;flex-wrap:wrap}
.epi-card .opts{display:grid;grid-template-columns:72px 1fr;gap:8px}
.epi-card .opts .full{grid-column:1/-1;display:grid;gap:4px;margin:0;color:var(--muted)}
.epi-card .opts .full .input{font-size:15px;font-weight:400;color:var(--ink)}
.summary-bar{position:sticky;bottom:0;margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow);flex-wrap:wrap}
@media (max-width:860px){.summary-bar{bottom:78px}}
.termo{font-size:14px;background:var(--surface-2);border-left:4px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:0}
.proof{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.proof img{border-radius:8px;border:1px solid var(--line);max-height:120px;background:#fff}
.success{text-align:center;padding:40px 20px}
.success .mark{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}

/* Charts */
.chart svg{width:100%;height:auto;display:block}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr 44px;gap:10px;align-items:center;font-size:14px}
.bar-row .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--brand);border-radius:5px}
:root[data-theme="dark"] .bar-row .fill{background:var(--brand-muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar-row .fill{background:var(--brand-muted)}}
.bar-row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px;font-size:18px}
.empty .actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.notice{padding:12px 16px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:14px;margin-bottom:16px}
.notice.info{background:var(--surface-2);color:var(--muted)}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-weight:500;max-width:90vw}
#toast div.bad{background:var(--bad);color:#fff}
#toast div.warn{background:var(--warn);color:#fff}
@media (max-width:860px){#toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}

/* Document (report) preview */

/* ---------- toast & modals ---------- */
function toast(msg,tone){const t=$('#toast');const d=document.createElement('div');if(tone)d.className=tone;d.textContent=msg;t.appendChild(d);setTimeout(()=>d.remove(),tone==='bad'?6000:3200);}
function openModal(html,{wide=false,cls='',onClose}={}){
  const bd=document.createElement('div');bd.className='backdrop';
  bd.innerHTML=`<div class="modal ${wide?'wide':''} ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  bd._onClose=onClose;
  bd.addEventListener('mousedown',e=>{if(e.target===bd)closeModal(bd);});
  $('#modal-root').appendChild(bd);
  setTimeout(()=>{const f=bd.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea');if(f&&!f.dataset.nofocus)f.focus();},30);
  return bd;
}
function closeModal(el,{silent=false}={}){
  const bd=el.closest?el.closest('.backdrop')||el:el;if(!bd||!bd.parentNode)return;
  bd.remove();if(!silent&&bd._onClose)bd._onClose();
  if(pendingRender&&!isEditing())render();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const all=$$('#modal-root .backdrop');if(all.length)closeModal(all[all.length-1]);}});
function askConfirm(msg,{ok='Confirmar',danger=false}={}){
  return new Promise(res=>{
    const m=openModal(`<div class="modal-head"><h2>Confirmar</h2></div><div class="modal-body"><p style="margin:0">${msg}</p></div>
    <div class="modal-foot"><button class="btn" data-x="no">Cancelar</button><button class="btn ${danger?'btn-dark':'btn-primary'}" data-x="yes">${esc(ok)}</button></div>`,{onClose:()=>res(false)});
    m.querySelector('[data-x=no]').onclick=()=>{closeModal(m,{silent:true});res(false)};
    m.querySelector('[data-x=yes]').onclick=()=>{closeModal(m,{silent:true});res(true)};
  });
}

/* ---------- storage (shared db, with local fallback) ---------- */
const DEMO=!!window.EPI_DEMO;const LS_PREFIX=DEMO?'epidemo:':'epi:';
const Store={
  mode:'local',db:null,sb:null,user:null,subs:{},maps:{},emit:{},ready:false,
  async init(){
    const C=window.EPI_CONFIG||{};
    if(C.supabaseUrl&&C.supabaseAnonKey&&!/COLE_AQUI/.test(C.supabaseUrl+C.supabaseAnonKey)&&window.supabase){
      this.sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
      this.mode='supabase';
      const {data}=await this.sb.auth.getSession();this.user=data&&data.session?data.session.user:null;
      this.ready=true;return;
    }
    let db=null;
    try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db');}catch(e){}
    if(db){this.db=db;this.mode='cloud';}
    this.ready=true;
  },
  async _fetchAll(col,filter){
    const out=[];
    for(let from=0;;from+=1000){
      let q=this.sb.from('docs').select('id,data').eq('col',col);
      if(filter)q=filter(q);
      const {data,error}=await q.order('id').range(from,from+999);
      if(error)throw error;
      for(const r of data)out.push({id:r.id,...r.data});
      if(data.length<1000)break;
    }
    return out;
  },
  watch(col,cb){
    if(this.mode==='supabase'){
      const map=this.maps[col]=new Map();const emit=this.emit[col]=()=>cb([...map.values()]);
      let first=true;
      const load=async()=>{try{const rows=await this._fetchAll(col);map.clear();rows.forEach(r=>map.set(r.id,r));emit();}
        catch(e){console.error(col,e);toast('Não foi possível carregar '+col+': '+(e.message||e),'bad');emit();}};
      load();
      const ch=this.sb.channel('docs-'+col)
        .on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+col},p=>{
          if(p.eventType==='DELETE'){if(p.old&&p.old.id)map.delete(p.old.id);}
          else if(p.new&&p.new.id)map.set(p.new.id,{id:p.new.id,...p.new.data});
          emit();})
        .subscribe(st=>{if(st==='SUBSCRIBED'){if(!first)load();first=false;}});
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load();});
      return()=>this.sb.removeChannel(ch);
    }
    if(this.mode==='cloud'){
      return this.db.collection(col).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),err=>{
        console.error(col,err);toast('A sincronização de '+col+' parou ('+(err&&err.code)+'). Recarregue a página.','bad');});
    }
    (this.subs[col]=this.subs[col]||[]).push(cb);cb(this._all(col));return()=>{};
  },
  _local(col,id,data){const m=this.maps[col];if(m){m.set(id,{id,...data});this.emit[col]();}},
  _read(col){try{return JSON.parse(localStorage.getItem(LS_PREFIX+col)||'{}')}catch(e){return{}}},
  _all(col){return Object.entries(this._read(col)).map(([id,v])=>({id,...v}))},
  _write(col,obj){try{localStorage.setItem(LS_PREFIX+col,JSON.stringify(obj))}catch(e){toast('O armazenamento deste navegador está cheio.','bad');throw e}
    (this.subs[col]||[]).forEach(cb=>cb(this._all(col)));},
  clean(o){const{id,...rest}=o;return JSON.parse(JSON.stringify(rest));},
  async set(col,id,data){
    data=this.clean(data);
    if(this.mode==='supabase'){
      const {error}=await this.sb.from('docs').upsert({col,id,data,updated_at:new Date().toISOString()});
      if(error)throw error;this._local(col,id,data);return;
    }
    if(this.mode==='cloud')return retry(()=>this.db.doc(col+'/'+id).set(data));
    const all=this._read(col);all[id]=data;this._write(col,all);
  },
  async update(col,id,patch){
    patch=this.clean(patch);
    if(this.mode==='supabase'){
      const {data:cur,error:e1}=await this.sb.from('docs').select('data').eq('col',col).eq('id',id).maybeSingle();
      if(e1)throw e1;
      const data={...((cur&&cur.data)||{}),...patch};
      const {error}=await this.sb.from('docs').upsert({col,id,data,updated_at:new Date().toISOString()});
      if(error)throw error;this._local(col,id,data);return;
    }
    if(this.mode==='cloud')return retry(()=>this.db.doc(col+'/'+id).update(patch));
    const all=this._read(col);all[id]={...(all[id]||{}),...patch};this._write(col,all);
  },
  async bulk(col,rows){
    if(this.mode==='supabase'){
      for(let i=0;i<rows.length;i+=100){
        const chunk=rows.slice(i,i+100).map(r=>({col,id:r.id,data:this.clean(r),updated_at:new Date().toISOString()}));
        const {error}=await this.sb.from('docs').upsert(chunk);if(error)throw error;
      }
      if(this.maps[col]){rows.forEach(r=>this.maps[col].set(r.id,{...r}));this.emit[col]();}
      return;
    }
    for(const r of rows)await this.set(col,r.id,r);
  },
  async insert(col,id,data){
    if(this.mode==='supabase'){

function lastByColabEpi(){
  const last={};
  for(const e of S.entregas)for(const it of (e.itens||[])){const k=e.colaboradorId+'|'+it.epiId;if(!last[k]||last[k]<e.data)last[k]=e.data;}

function trocas(){
  const out=[];

    const [cid,eid]=k.split('|');const c=colabById(cid),p=epiById(eid);

    const vence=addDays(d,p.periodicidadeDias);const dias=daysUntil(vence);
    if(dias<=7)out.push({c,p,ultima:d,vence,dias});

/* ---------- face recognition ---------- */
const Face={
  ready:false,loading:null,
  loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s);});},
  b64(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;},
  load(){
    if(this.ready)return Promise.resolve();
    if(this.loading)return this.loading;
    this.loading=(async()=>{
      if(!window.faceapi)await this.loadScript(FACEAPI_URL);
      const tf=faceapi.tf;
      let ok=false;try{ok=await tf.setBackend('webgl');}catch(e){ok=false;}if(!ok){await tf.setBackend('cpu');}await tf.ready();
      const raw=($('#face-models')&&$('#face-models').textContent||'').trim();let models;
      if(raw&&raw[0]==='{')models=JSON.parse(raw);else{const base=FACEAPI_URL.replace('dist/face-api.js','model/');await faceapi.nets.tinyFaceDetector.loadFromUri(base);await faceapi.nets.faceLandmark68TinyNet.loadFromUri(base);await faceapi.nets.faceRecognitionNet.loadFromUri(base);this.ready=true;return;}
      const nets=[['tiny_face_detector_model',faceapi.nets.tinyFaceDetector],['face_landmark_68_tiny_model',faceapi.nets.faceLandmark68TinyNet],['face_recognition_model',faceapi.nets.faceRecognitionNet]];
      for(const [key,net] of nets){
        const m=models[key];let map=tf.io.decodeWeights(this.b64(m.bin),m.manifest.flatMap(g=>g.weights));
        if(map&&typeof map.then==='function')map=await map;
        net.loadFromWeightMap(map);
      }
      this.ready=true;
    })().catch(e=>{this.loading=null;throw e;});
    return this.loading;
  },
  async detect(input){
    return faceapi.detectSingleFace(input,new faceapi.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:0.4})).withFaceLandmarks(true).withFaceDescriptor();
  },
  minDist(desc,list){let m=Infinity;for(const d of (list||[])){let s=0;for(let i=0;i<128;i++){const x=desc[i]-d[i];s+=x*x;}const r=Math.sqrt(s);if(r<m)m=r;}return m;},
  best(desc,colabs){let b=null;for(const c of colabs){const d=this.minDist(desc,c.faceDescriptors);if(!b||d<b.d)b={c,d};}return b;},
  pack(desc){return Array.from(desc).map(v=>Math.round(v*1e4)/1e4);}
};
const srcW=s=>s.videoWidth||s.naturalWidth||s.width;
const srcH=s=>s.videoHeight||s.naturalHeight||s.height;
function cropFace(src,b){
  const p=.45,vw=srcW(src),vh=srcH(src);
  const x=Math.max(0,b.x-b.width*p),y=Math.max(0,b.y-b.height*p*1.2);
  const w=Math.min(vw-x,b.width*(1+2*p)),h=Math.min(vh-y,b.height*(1+2*p*1.2));const side=Math.min(w,h);
  const c=document.createElement('canvas');c.width=c.height=160;
  c.getContext('2d').drawImage(src,x+(w-side)/2,y+(h-side)/2,side,side,0,0,160,160);
  return c.toDataURL('image/jpeg',.8);
}
function grabFrame(src,width=320){
  const c=document.createElement('canvas');c.width=width;c.height=Math.round(srcH(src)*width/srcW(src));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7);
}
const TOUCH=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
const PICK_LBL=TOUCH?'Tirar foto':'Escolher foto do rosto';

  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return false;
  try{const pp=document.permissionsPolicy||document.featurePolicy;if(pp&&typeof pp.allowsFeature==='function')return pp.allowsFeature('camera');}catch(e){}
  return true;
}
function camError(e){
  const n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError')return 'A câmera ao vivo não foi liberada nesta página.';
  if(n==='NotFoundError'||n==='OverconstrainedError')return 'Nenhuma câmera foi encontrada neste dispositivo.';

/* mode: enroll | identify | verify. Live camera when allowed; photo capture otherwise. */
function cameraModal({mode,colab,title}){
  return new Promise(resolve=>{
    let stream=null,running=true,resolved=false,lastDet=null,streak=0,streakId=null,miss=0,photo=false;const samples=[];let foto=null;
    const lim=Number(cfg().limiar)||0.5;
    const sub={enroll:'Capture 3 amostras do rosto, mudando levemente a posição entre elas.',identify:'Posicione o rosto do colaborador de frente, com boa luz.',verify:`Peça para ${esc(colab&&colab.nome)} olhar para a câmera para confirmar o recebimento.`}[mode];
    const m=openModal(`
      <div class="modal-head"><div><h2>${esc(title)}</h2><div class="small muted" style="margin-top:4px">${sub}</div></div><button class="icon-btn" data-close aria-label="Fechar">${I.close}</button></div>
      <div class="scanner"><video playsinline muted autoplay></video><canvas></canvas><img class="still" alt="" hidden><div class="brackets"><i></i><i></i><i></i><i></i></div></div>
      ${mode==='enroll'?'<div class="samples"><span></span><span></span><span></span></div>':''}
      <div class="scan-status" aria-live="polite">Abrindo a câmera…</div>
      <input type="file" accept="image/*" capture="user" hidden data-file>
      <div class="modal-foot" style="margin-top:16px"></div>`,{cls:'cam-modal',onClose:()=>{running=false;stop();if(!resolved){resolved=true;resolve(null);}}});
    const video=$('video',m),canvas=$('canvas',m),still=$('img.still',m),box=$('.scanner',m),statusEl=$('.scan-status',m),foot=$('.modal-foot',m),fileIn=$('[data-file]',m);
    m.querySelector('[data-close]').onclick=()=>closeModal(m);
    function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
    function finish(v){if(resolved)return;resolved=true;running=false;stop();closeModal(m,{silent:true});resolve(v);}
    function status(t,tone){statusEl.textContent=t;statusEl.dataset.tone=tone||'';}
    function paintSamples(){$$('.samples span',m).forEach((s,i)=>s.classList.toggle('on',i<samples.length));}
    function draw(det,color){
      const cw=box.clientWidth,ch=box.clientHeight,dpr=window.devicePixelRatio||1;
      if(canvas.width!==Math.round(cw*dpr)){canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);}
      const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cw,ch);
      if(!det||!video.videoWidth)return;
      const vw=video.videoWidth,vh=video.videoHeight,s=Math.max(cw/vw,ch/vh),ox=(cw-vw*s)/2,oy=(ch-vh*s)/2;const b=det.detection.box;
      ctx.strokeStyle=color||'#F2B705';ctx.lineWidth=3;ctx.strokeRect(ox+b.x*s,oy+b.y*s,b.width*s,b.height*s);
    }
    async function finishEnroll(){
      const others=enrolled().filter(c=>!colab||c.id!==colab.id);const dup=others.length?Face.best(samples[0],others):null;
      if(dup&&dup.d<lim){
        const ok=await askConfirm(`Este rosto é muito parecido com o de <b>${esc(dup.c.nome)}</b>, que já tem biometria cadastrada. Deseja salvar mesmo assim?`,{ok:'Salvar mesmo assim'});
        if(!ok){samples.length=0;foto=null;paintSamples();return false;}
      }
      finish({descriptors:samples.slice(),foto});return true;
    }

    /* ---- live camera ---- */
    function liveFooter(){
      const photoBtn=`<button class="btn" data-pick>Usar foto</button>`;
      if(mode==='enroll')foot.innerHTML=`<button class="btn" data-cl>Cancelar</button>${photoBtn}<button class="btn btn-primary" data-cap disabled>${I.face} Capturar amostra (0/3)</button>`;
      else if(mode==='verify')foot.innerHTML=`<button class="btn" data-fb>${I.pen} Usar assinatura na tela</button>${photoBtn}`;
      else foot.innerHTML=`<button class="btn" data-cl>Buscar pelo nome</button>${photoBtn}`;
      wireFoot();
    }
    function wireFoot(){
      const q=s=>foot.querySelector(s);
      if(q('[data-cl]'))q('[data-cl]').onclick=()=>closeModal(m);
      if(q('[data-fb]'))q('[data-fb]').onclick=()=>finish({fallback:true});
      if(q('[data-pick]'))q('[data-pick]').onclick=()=>{if(!photo)photoMode('Tire ou escolha uma foto do rosto, de frente e com boa luz.','');fileIn.value='';fileIn.click();};
      if(q('[data-cap]'))q('[data-cap]').onclick=capture;
      if(q('[data-done]'))q('[data-done]').onclick=()=>{if(samples.length)finishEnroll();};
    }
    async function capture(){
      if(!lastDet){status('Nenhum rosto na moldura. Aproxime o rosto e tente de novo.','warn');return;}
      samples.push(Face.pack(lastDet.descriptor));if(!foto)foto=cropFace(video,lastDet.detection.box);paintSamples();
      const btn=foot.querySelector('[data-cap]');btn.innerHTML=`${I.face} Capturar amostra (${samples.length}/3)`;
      if(samples.length>=3){running=false;if(!await finishEnroll()){btn.innerHTML=`${I.face} Capturar amostra (0/3)`;running=true;loop();}}
      else status('Amostra '+samples.length+' registrada. Mude levemente a posição e capture a próxima.','ok');
    }
    async function loop(){
      if(!running)return;

        if(video.readyState>=2&&Face.ready){
          const det=await Face.detect(video);if(!running)return;lastDet=det||null;
          if(mode==='enroll'){
            const btn=foot.querySelector('[data-cap]');if(btn)btn.disabled=!det;
            draw(det);if(samples.length===0||!det)status(det?'Rosto detectado. Toque em Capturar amostra.':'Posicione o rosto dentro da moldura.',det?'ok':'');
          }else if(mode==='identify'){
            const list=enrolled();
            if(!list.length){status('Nenhum colaborador tem biometria cadastrada ainda. Cadastre o rosto em Colaboradores.','warn');draw(det);}
            else if(det){
              const b=Face.best(det.descriptor,list);
              if(b&&b.d<lim){if(streakId===b.c.id)streak++;else{streakId=b.c.id;streak=1;}miss=0;draw(det,'#5BD08B');status('Reconhecendo '+b.c.nome+'…','ok');
                if(streak>=3){box.classList.add('matched');setTimeout(()=>finish({colab:b.c,d:b.d}),250);return;}}
              else{streak=0;miss++;draw(det);status(miss>4?'Rosto não reconhecido. Confira a iluminação ou busque pelo nome.':'Rosto detectado. Comparando com os cadastros…',miss>4?'warn':'');}
            }else{draw(null);status('Posicione o rosto dentro da moldura.');}
          }else{
            if(det){
              const d=Face.minDist(det.descriptor,colab.faceDescriptors);
              if(d<lim){streak++;miss=0;draw(det,'#5BD08B');status('Confirmando identidade…','ok');
                if(streak>=3){box.classList.add('matched');const f=grabFrame(video,640);setTimeout(()=>finish({distancia:Math.round(d*1000)/1000,foto:f}),250);return;}}
              else{streak=0;miss++;draw(det,'#FF6B5E');if(miss<=4)status('Rosto detectado. Comparando…');else status('O rosto não confere com '+colab.nome+'. Se for a pessoa certa, melhore a iluminação ou use a assinatura na tela.','bad');}
            }else{draw(null);status('Posicione o rosto dentro da moldura.');}
          }
        }
      }catch(e){console.error(e);}
      if(running)setTimeout(loop,90);
    }

    /* ---- photo capture (works where live camera is blocked) ---- */
    function photoMode(msg,tone='warn'){
      photo=true;running=false;stop();video.hidden=true;canvas.hidden=true;
      status(msg,tone);
      const pick=`<button class="btn btn-primary" data-pick>${I.face} ${PICK_LBL}${mode==='enroll'?' (0/3)':''}</button>`;
      if(mode==='enroll')foot.innerHTML=`<button class="btn" data-cl>Cancelar</button><button class="btn" data-done hidden>Concluir</button>${pick}`;
      else if(mode==='verify')foot.innerHTML=`<button class="btn" data-fb>${I.pen} Usar assinatura na tela</button>${pick}`;
      else foot.innerHTML=`<button class="btn" data-cl>Buscar pelo nome</button>${pick}`;

    }
    fileIn.addEventListener('change',async()=>{
      const file=fileIn.files&&fileIn.files[0];if(!file)return;
      const pickBtn=foot.querySelector('[data-pick]');if(pickBtn)pickBtn.disabled=true;
      status('Analisando a foto…');box.classList.remove('matched');
      try{
        const url=URL.createObjectURL(file);still.src=url;still.hidden=false;
        try{await still.decode();}catch(e){status('Não foi possível abrir esta imagem. Use uma foto JPG ou PNG.','bad');return;}
        if(!Face.ready){status('Preparando o reconhecimento facial. Na primeira vez leva alguns segundos…');}

        const det=await Face.detect(still);
        if(!det){status('Nenhum rosto encontrado na foto. Tire outra, de frente, com o rosto grande e boa luz.','warn');return;}
        if(mode==='enroll'){

        }else if(mode==='identify'){

          if(!list.length){status('Nenhum colaborador tem biometria cadastrada ainda.','warn');return;}

          else status('Rosto não reconhecido. Tire outra foto ou busque pelo nome.','warn');
        }else{
          const d=Face.minDist(det.descriptor,colab.faceDescriptors);
          if(d<lim){box.classList.add('matched');status('Identidade confirmada.','ok');const f=grabFrame(still,640);setTimeout(()=>finish({distancia:Math.round(d*1000)/1000,foto:f}),500);}

        }
      }catch(e){console.error(e);status('Não foi possível analisar a foto.','bad');}

    });

    (async()=>{
      if(!liveCameraAllowed()){photoMode(TOUCH?'A câmera ao vivo não é liberada dentro do visualizador do Claude. Toque em Tirar foto para abrir a câmera frontal.':'A câmera ao vivo não é liberada dentro do visualizador do Claude, e no computador o navegador só permite escolher um arquivo. Escolha uma foto do rosto (tirada no Photo Booth ou no celular), ou use um celular/tablet, onde o botão abre a câmera.');return;}
      liveFooter();
      try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});}
      catch(e){photoMode(camError(e)+' Tire ou escolha uma foto do rosto: no celular e no tablet, o botão abre a câmera frontal.');return;}
      if(!running||photo){stop();return;}
      video.srcObject=stream;try{await video.play();}catch(e){}
      if(!Face.ready)status('Preparando o reconhecimento facial. Na primeira vez leva alguns segundos…');
      try{await Face.load();}catch(e){console.error(e);status('Não foi possível carregar o reconhecimento facial neste navegador.','bad');return;}
      if(photo)return;
      status('Posicione o rosto dentro da moldura.');loop();
    })();

}
function signatureModal(colab){
  return new Promise(resolve=>{
    let done=false;
    const m=openModal(`<div class="modal-head"><div><h2>Assinatura do colaborador</h2><div class="small muted" style="margin-top:4px">${esc(colab.nome)} assina com o dedo ou o mouse na área abaixo.</div></div><button class="icon-btn" data-close aria-label="Fechar">${I.close}</button></div>
      <div class="modal-body"><div class="sig-wrap"><div class="base"></div><canvas width="900" height="300"></canvas></div></div>
      <div class="modal-foot"><button class="btn" data-clear>Limpar</button><button class="btn btn-primary" data-ok>Confirmar assinatura</button></div>`,{wide:true,onClose:()=>{if(!done){done=true;resolve(null);}}});
    m.querySelector('[data-close]').onclick=()=>closeModal(m);
    const cv=$('canvas',m),ctx=cv.getContext('2d');let drawing=false,drawn=false,last=null;
    const reset=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);drawn=false;};reset();
    ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle='#14252a';
    const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};};
    cv.addEventListener('pointerdown',e=>{drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);});
    cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;drawn=true;});
    const up=()=>{drawing=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    m.querySelector('[data-clear]').onclick=reset;
    m.querySelector('[data-ok]').onclick=()=>{
      if(!drawn){toast('A área de assinatura está vazia.','warn');return;}
      const s=document.createElement('canvas');s.width=450;s.height=150;s.getContext('2d').drawImage(cv,0,0,450,150);
      done=true;closeModal(m,{silent:true});resolve({assinatura:s.toDataURL('image/jpeg',.75)});
    };
  });
}

/* ---------- localização e carimbo na evidência ---------- */
const Geo={last:null,pending:null,
  get(max=8000){
    if(this.last&&Date.now()-this.last.t<120000)return Promise.resolve(this.last);
    if(this.pending)return this.pending;
    this.pending=new Promise(res=>{
      if(!navigator.geolocation){res({erro:'Aparelho sem localização'});return;}
      let done=false;const tm=setTimeout(()=>{if(!done){done=true;res({erro:'Localização demorou demais'});}},max);
      navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(tm);
          this.last={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),t:Date.now()};res(this.last);},
        e=>{if(done)return;done=true;clearTimeout(tm);res({erro:e.code===1?'Permissão de localização negada':'Localização indisponível'});},
        {enableHighAccuracy:true,timeout:max,maximumAge:60000});
    }).finally(()=>{this.pending=null;});
    return this.pending;
  }
};
const fmtStamp=d=>{const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;};
const geoTxt=g=>g&&g.lat!=null?`Lat ${g.lat.toFixed(6)}  Long ${g.lng.toFixed(6)}  (±${g.acc} m)`:`Localização: ${g&&g.erro?g.erro.toLowerCase():'indisponível'}`;
const geoRec=g=>g&&g.lat!=null?{lat:g.lat,lng:g.lng,precisao:g.acc}:{lat:null,lng:null,precisao:null,geoErro:(g&&g.erro)||'indisponível'};
async function stampImage(dataUrl,when,g,{below=false}={}){
  const img=new Image();img.src=dataUrl;await img.decode();
  const W=img.naturalWidth,H=img.naturalHeight;const fs=Math.max(12,Math.round(W/34)),pad=Math.round(fs*.55),lh=Math.round(fs*1.28);
  const k=cfg();const lines=[fmtStamp(when),geoTxt(g),[k.nomeCurto||k.empresa,k.unidade].filter(Boolean).join(' · ')].filter(Boolean);
  const boxH=pad*2+lh*lines.length;
  const c=document.createElement('canvas');c.width=W;c.height=below?H+boxH:H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0);
  x.font=`600 ${fs}px Barlow, "Helvetica Neue", Arial, sans-serif`;x.textBaseline='top';
  const tw=Math.min(W-2*pad,Math.max(...lines.map(t=>x.measureText(t).width)));
  const bw=below?W:Math.min(W,tw+pad*2),bx=W-bw,by=c.height-boxH;
  x.fillStyle=below?'#14252a':'rgba(0,0,0,.62)';x.fillRect(bx,by,bw,boxH);
  x.fillStyle='#fff';x.textAlign=below?'left':'right';
  lines.forEach((t,i)=>x.fillText(t,below?pad:W-pad,by+pad+i*lh,W-2*pad));
  return c.toDataURL('image/jpeg',.78);
}

async function wizardTo3(){
  const probs=[];
  for(const [id,v] of Object.entries(W.itens)){const p=epiById(id);if(!p)continue;const ca=caStatus(p);
    if(ca&&ca.level==='bad')probs.push(`<b>${esc(p.nome)}</b>: CA vencido em ${fmtDate(p.validadeCA)}`);
    if(Number(p.estoque||0)<v.qtd)probs.push(`<b>${esc(p.nome)}</b>: estoque (${Number(p.estoque||0)}) menor que a quantidade`);}
  if(probs.length&&!await askConfirm('Atenção antes de continuar:<br><br>'+probs.join('<br>')+'<br><br>A NR-06 exige EPI com CA válido. Deseja continuar mesmo assim?',{ok:'Continuar'}))return;
  W.step=3;W.valid=null;render(true);window.scrollTo(0,0);
}
async function saveDelivery(){
  const c=colabById(W.colabId);if(!c||!W.valid||W.saving)return;
  W.saving=true;render(true);
  const id=newId(),now=new Date().toISOString();
  const itens=Object.entries(W.itens).map(([eid,v])=>{const p=epiById(eid);return p?{epiId:eid,nome:p.nome,ca:p.ca||'',qtd:Number(v.qtd)||1,motivo:v.motivo,devolucao:v.devolucao||'Não se aplica',custoUnit:Number(p.custoUnit)||0,proximaTroca:Number(p.periodicidadeDias)?addDays(now,p.periodicidadeDias):null}:null;}).filter(Boolean);
  const entrega={colaboradorId:c.id,colaboradorNome:c.nome,matricula:c.matricula||'',cpf:c.cpf||'',setor:c.setor||'',funcao:c.funcao||'',data:now,itens,obs:W.obs||'',
    validacao:{metodo:W.valid.metodo,distancia:W.valid.distancia??null,dataHora:W.valid.dataHora,...(W.valid.geo||{})},registradoPor:S.uid||null};
  try{
    await Store.insert('evidencias',id,{colaboradorId:c.id,entregaId:id,metodo:W.valid.metodo,foto:W.valid.foto||null,assinatura:W.valid.assinatura||null,dataHora:W.valid.dataHora,...(W.valid.geo||{})});
    await Store.insert('entregas',id,entrega);
    for(const it of itens){try{await Store.baixarEstoque(it.epiId,it.qtd);}catch(e){console.error(e);toast('Entrega registrada, mas não foi possível baixar o estoque de '+it.nome+'.','warn');}}
    delete S.evCache[c.id];
    W.done={colabId:c.id,n:sum(itens.map(i=>i.qtd)),data:now};
  }catch(e){toast(errMsg(e),'bad');}
  W.saving=false;render(true);window.scrollTo(0,0);
}

  const d=geralData();const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};

  const lines=d.rows.map(({e,it})=>{const dt=new Date(e.data);return[dt.toLocaleDateString('pt-BR'),dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),e.colaboradorNome,e.matricula,e.cpf,e.setor,e.funcao,it.nome,it.ca,it.qtd,it.motivo,it.devolucao||'',String((it.custoUnit||0).toFixed(2)).replace('.',','),String((it.qtd*(it.custoUnit||0)).toFixed(2)).replace('.',','),it.proximaTroca?fmtDate(it.proximaTroca):'',e.validacao&&e.validacao.metodo==='facial'?'Reconhecimento facial':'Assinatura',...(e.validacao&&e.validacao.lat!=null?[String(e.validacao.lat).replace('.',','),String(e.validacao.lng).replace('.',','),e.validacao.precisao]:['','','']),e.obs].map(q).join(';');});
  return '\uFEFF'+[hdr.join(';'),...lines].join('\r\n');
}

async function shrinkLogo(f){
  const url=URL.createObjectURL(f);const img=new Image();img.src=url;await img.decode();
  const W=Math.max(1,img.naturalWidth||300),H=Math.max(1,img.naturalHeight||120);const k=Math.min(1,480/W,200/H);
  const c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let out=c.toDataURL('image/png');
  if(out.length>180000){const c2=document.createElement('canvas');c2.width=c.width;c2.height=c.height;const x=c2.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c2.width,c2.height);x.drawImage(c,0,0);out=c2.toDataURL('image/jpeg',.85);}
  URL.revokeObjectURL(url);return out;
}

async function restoreBackup(file){
  if(!file)return;let data;try{data=JSON.parse(await file.text());}catch(e){toast('Arquivo inválido. Use o backup .json gerado pelo sistema.','bad');return;}
  const cols=[['colaboradores','colaboradores'],['epis','epis'],['entregas','entregas'],['evidencias','evidencias']];
  const n=cols.reduce((a,[k])=>a+((data[k]||[]).length),0);
  if(!n&&!data.config){toast('O arquivo não contém dados do EPI Uai.','warn');return;}
  if(!await askConfirm(`Importar ${(data.colaboradores||[]).length} colaboradores, ${(data.epis||[]).length} EPIs e ${(data.entregas||[]).length} entregas? Registros com o mesmo código serão substituídos.`,{ok:'Importar'}))return;
  try{
    toast('Importando…');
    if(data.config&&Object.keys(data.config).length)await Store.set('config','app',data.config);
    for(const [k,col] of cols){const rows=(data[k]||[]).filter(r=>r&&r.id);if(rows.length)await Store.bulk(col,rows);}
    S.evCache={};toast('Backup importado.');render(true);
  }catch(e){toast(errMsg(e),'bad');}
}

  const r=e.target.closest('tr[data-href]');if(r){location.hash=r.dataset.href;}
});


/* ---------- Demonstração ---------- */
function demoSignature(seed){
  const c=document.createElement('canvas');c.width=450;c.height=150;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,450,150);
  x.strokeStyle='#14252a';x.lineWidth=3;x.lineCap='round';x.beginPath();let r=seed*9301+49297;const rnd=()=>((r=(r*9301+49297)%233280)/233280);
  x.moveTo(60,95);for(let i=0;i<9;i++){x.bezierCurveTo(80+i*36,40+rnd()*30,95+i*36,120-rnd()*20,110+i*36,80+rnd()*25);}x.stroke();
  x.beginPath();x.moveTo(70,110);x.lineTo(380,104);x.stroke();return c.toDataURL('image/jpeg',.7);
}
function demoSeed(){

  const day=86400000,now=Date.now(),hoje0=new Date().setHours(0,0,0,0),iso=t=>new Date(t).toISOString(),dISO=t=>new Date(t).toISOString().slice(0,10);
  put('config',[{id:'app',empresa:'Frigorífico Modelo Alimentos Ltda',nomeCurto:'Frigorífico Modelo',cnpj:'11.222.333/0001-81',unidade:'Unidade Demonstração – MG',responsavel:'Ana Paula Ribeiro',cargoResponsavel:'Técnica de Segurança do Trabalho',encarregado:'lgpd@frigorificomodelo.com.br',limiar:0.5}]);
  const E=[['e1','Luva de malha de aço','12451','Proteção dos membros superiores',365,3,20,4,189.9],['e2','Luva nitrílica cano longo','38210','Proteção dos membros superiores',15,90,40,60,9.8],['e3','Bota de PVC branca cano longo','42077','Proteção dos membros inferiores',180,20,-3,8,54.9],['e4','Avental de PVC impermeável','29874','Proteção do tronco',60,45,4,10,32.5],['e5','Protetor auricular tipo plug','5745','Proteção auditiva',30,300,200,100,1.9],['e6','Japona térmica para câmara fria','40121','Proteção do tronco',365,25,90,6,219],['e7','Óculos de proteção incolor','10346','Proteção dos olhos e face',180,35,500,10,12.4],['e8','Touca árabe (capuz)','33415','Proteção da cabeça',90,60,300,20,6.5]];
  put('epis',E.map(([id,nome,ca,categoria,per,est,caDias,min,custo])=>({id,nome,ca,categoria,periodicidadeDias:per,estoque:est,estoqueMinimo:min,custoUnit:custo,validadeCA:dISO(now+caDias*day),fabricante:'',descricao:'',ativo:true})));
  const P=[['Adriano Costa','Filetagem','Operador de filetagem'],['Bruna Martins','Filetagem','Operadora de filetagem'],['Carlos Eduardo Lima','Recepção','Auxiliar de produção'],['Daniela Souza','Embalagem','Auxiliar de embalagem'],['Edson Pereira','Câmara fria','Operador de câmara fria'],['Fernanda Alves','Embalagem','Auxiliar de embalagem'],['Gilberto Nunes','Manutenção','Mecânico industrial'],['Helena Rocha','Filetagem','Operadora de filetagem'],['Igor Fernandes','Recepção','Auxiliar de produção'],['Juliana Teixeira','Qualidade','Analista de qualidade'],['Lucas Barbosa','Câmara fria','Operador de empilhadeira'],['Márcia Gomes','Embalagem','Líder de embalagem']];
  const t0=i=>175-(i*5)%40;
  const C=P.map(([nome,setor,funcao],i)=>({id:'c'+(i+1),nome,setor,funcao,matricula:String(1101+i),cpf:'',unidade:'Unidade Demonstração – MG',admissao:dISO(hoje0-t0(i)*day),ativo:true}));
  put('colaboradores',C);
  const kit={Filetagem:['e1','e2','e3','e4','e5','e8'],Recepção:['e2','e3','e4','e5','e8'],Embalagem:['e2','e3','e5','e8'],'Câmara fria':['e3','e5','e6','e8'],Manutenção:['e3','e5','e7'],Qualidade:['e3','e8']};
  const ents=[],evs=[];let n=0;
  C.forEach((c,ci)=>{const k=kit[c.setor]||['e3'];
    for(let t=t0(ci);t>0;t-=18+((ci*7+t)%11)){const adm=t===t0(ci);const pick=adm?k:k.filter((_,j)=>(t+j+ci)%3!==0).slice(0,3);if(!pick.length)continue;
      const when=hoje0-t*day+(7+ci%6)*3600000+((ci*13+t*7)%50)*60000;const id='d'+(++n);
      const itens=pick.map(eid=>{const e=E.find(x=>x[0]===eid);return{epiId:eid,nome:e[1],ca:e[2],qtd:eid==='e2'||eid==='e5'?2:1,motivo:adm?'Admissão / primeira entrega':'Troca periódica',devolucao:adm?'Não se aplica':'Devolvido',custoUnit:e[8],proximaTroca:new Date(when+e[4]*day).toISOString()};});
      ents.push({id,colaboradorId:c.id,colaboradorNome:c.nome,matricula:c.matricula,cpf:'',setor:c.setor,funcao:c.funcao,data:iso(when),itens,obs:'',validacao:{metodo:'assinatura',distancia:null,dataHora:iso(when)},registradoPor:null});
      evs.push({id,colaboradorId:c.id,entregaId:id,metodo:'assinatura',foto:null,assinatura:demoSignature(n),dataHora:iso(when)});}});
  put('entregas',ents);put('evidencias',evs);localStorage.setItem(LS_PREFIX+'seeded','3');
}

/* ---------- login (Supabase) ---------- */
function showLogin(msg){
  document.body.innerHTML=`<div class="login-wrap"><form class="panel login" id="login-form">
    <div class="brandmark" style="padding:0;margin-bottom:18px"><div class="logo"><svg viewBox="0 0 64 64" width="100%" height="100%" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#F2B705"/><path d="M13 41 A19 19 0 0 1 51 41 Z" fill="#1E1800"/><rect x="29" y="21.5" width="6" height="19.5" rx="2" fill="#F2B705"/><path d="M20.5 41 A12.5 12.5 0 0 1 24 31.5" fill="none" stroke="#F2B705" stroke-width="2.6" stroke-linecap="round"/><path d="M9 41 H53 Q58 41 58 45.5 V46 H11 Q9 46 9 44 Z" fill="#1E1800"/></svg></div><div><b style="color:var(--ink)">${brandHTML()}</b><span>Entre com o seu e-mail e senha</span></div></div>
    <div class="field"><label for="l-email">E-mail</label><input class="input" type="email" id="l-email" required autocomplete="username"></div>
    <div class="field" style="margin-top:12px"><label for="l-pass">Senha</label><input class="input" type="password" id="l-pass" required autocomplete="current-password"></div>
    <p class="small" id="l-msg" style="min-height:20px;color:var(--bad)">${esc(msg||'')}</p>
    <button class="btn btn-primary btn-lg" style="width:100%" type="submit">Entrar</button>
    <button class="btn" type="button" id="l-forgot" style="width:100%;margin-top:8px;border:0;background:none">Esqueci minha senha</button>
    ${BRAND.fornecedor||BRAND.contato?`<p class="small muted" style="text-align:center;margin:14px 0 0">${esc([BRAND.fornecedor,BRAND.contato].filter(Boolean).join(' · '))}</p>`:''}
  </form></div><div id="toast" role="status" aria-live="polite"></div>`;
  const f=$('#login-form'),m=$('#l-msg');
  f.onsubmit=async e=>{e.preventDefault();m.style.color='var(--muted)';m.textContent='Entrando…';
    const {error}=await Store.sb.auth.signInWithPassword({email:$('#l-email').value.trim(),password:$('#l-pass').value});
    if(error){m.style.color='var(--bad)';m.textContent=/invalid/i.test(error.message)?'E-mail ou senha incorretos.':error.message;return;}
    location.reload();};
  $('#l-forgot').onclick=async()=>{const email=$('#l-email').value.trim();if(!email){m.style.color='var(--bad)';m.textContent='Digite o seu e-mail acima e toque de novo em "Esqueci minha senha".';return;}
    const {error}=await Store.sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    m.style.color=error?'var(--bad)':'var(--ok)';m.textContent=error?error.message:'Enviamos um link para redefinir a senha. Confira o seu e-mail.';};
}
function newPasswordModal(){
  const m=openModal(`<form id="np-form"><div class="modal-head"><h2>Definir nova senha</h2></div><div class="modal-body"><div class="field"><label for="np">Nova senha (mínimo 8 caracteres)</label><input class="input" type="password" id="np" minlength="8" required autocomplete="new-password"></div></div>
    <div class="modal-foot"><button class="btn btn-primary" type="submit">Salvar senha</button></div></form>`);
  $('#np-form',m).onsubmit=async e=>{e.preventDefault();const {error}=await Store.sb.auth.updateUser({password:$('#np',m).value});
    if(error){toast(error.message,'bad');return;}closeModal(m,{silent:true});toast('Senha atualizada.');history.replaceState(null,'',location.pathname+'#painel');};
}

/* ---------- boot ---------- */
(async function boot(){
  renderNav();
  await Store.init();
  if(Store.mode==='supabase'){
    Store.sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setTimeout(newPasswordModal,300);});
    if(/type=recovery/.test(location.hash)){const {data}=await Store.sb.auth.getSession();Store.user=data&&data.session?data.session.user:Store.user;}
    if(!Store.user){showLogin();return;}
    S.uid=Store.user.email;S.names[S.uid]=Store.user.email;
    try{const pf=await Store.perfil();S.papel=pf.papel;}catch(e){console.error(e);S.papel='operador';}
    if(/type=recovery/.test(location.hash)||/access_token=/.test(location.hash))history.replaceState(null,'',location.pathname+'#painel');
  }
  try{if(Store.mode!=='supabase'&&window.claude&&window.claude.use){const u=await window.claude.use('user');if(u){S.userCap=u;try{S.uid=await u.id();}catch(e){}}}}catch(e){}
  if(DEMO&&Store.mode==='local'){try{demoSeed();}catch(e){console.error(e);}
    const bar=document.createElement('div');bar.className='demo-bar';bar.innerHTML='Demonstração com dados fictícios. O que você fizer fica salvo só neste navegador. Experimente cadastrar o seu rosto em Colaboradores.';document.body.prepend(bar);}
  const mark=k=>{S.loaded[k]=true;};
  Store.watch('colaboradores',rows=>{S.colabs=rows.sort(byName);mark('colaboradores');render();});
  Store.watch('epis',rows=>{S.epis=rows;mark('epis');render();});
  Store.watch('entregas',rows=>{S.entregas=rows.sort((a,b)=>a.data<b.data?1:-1);mark('entregas');render();});
  Store.watch('config',rows=>{S.config=(rows.find(r=>r.id==='app'))||{};mark('config');render();});
  renderNav();
})();
</script>
